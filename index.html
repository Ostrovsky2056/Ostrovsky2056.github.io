<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ostrovsky2056’s directory of open-source browser tools." data-zh-cn-content="Ostrovsky2056 的开源浏览器工具目录。">
  <meta name="theme-color" content="#111710">
  <title data-zh-cn="Open Projects · 开源项目">Open Projects</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/site.css?v=2">
  <script src="assets/i18n.js?v=2" defer></script>
</head>
<body id="top">
  <a class="skip-link button" href="#main" data-zh-cn="跳到主要内容">Skip to main content</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#top" aria-label="Open Projects home" data-zh-cn-aria-label="Open Projects 首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-label" lang="en">Open Projects</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation" data-zh-cn-aria-label="主导航">
        <a href="#projects" data-zh-cn="项目">Projects</a>
        <a href="https://github.com/Ostrovsky2056">GitHub</a>
        <details class="language-menu" data-language-menu hidden>
          <summary class="language-trigger">
            <span class="visually-hidden" data-zh-cn="站点语言">Site language</span>
            <span data-language-indicator lang="en">EN</span>
          </summary>
          <div class="language-options">
            <button type="button" data-language-choice="auto" data-zh-cn="跟随浏览器" aria-pressed="true">Follow browser</button>
            <button type="button" data-language-choice="en" lang="en" aria-pressed="false">English</button>
            <button type="button" data-language-choice="zh-CN" lang="zh-CN" aria-pressed="false">简体中文</button>
          </div>
        </details>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="shell hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">
          <span data-zh-cn="浏览器里的">Open-source tools</span><br>
          <span class="hero-accent" data-zh-cn="开源项目">for your browser.</span>
        </h1>
        <p data-zh-cn="Ostrovsky2056 的个人项目目录。">A project directory by Ostrovsky2056.</p>
      </div>

      <div class="hero-art" aria-hidden="true">
        <div class="browser-shape browser-shape-back"></div>
        <div class="browser-shape browser-shape-middle"></div>
        <div class="browser-shape browser-shape-front">
          <div class="browser-bar">
            <span class="browser-dots"><i></i><i></i><i></i></span>
            <span class="browser-address"></span>
          </div>
          <div class="browser-body">
            <span class="browser-code">&lt;/&gt;</span>
            <span class="browser-lines"><i></i><i></i><i></i></span>
          </div>
        </div>
        <span class="art-corner art-corner-top"></span>
        <span class="art-corner art-corner-bottom"></span>
      </div>
    </section>

    <section class="shell directory" id="projects" aria-labelledby="projects-title">
      <h2 id="projects-title" data-zh-cn="项目目录">Projects</h2>

      <p class="directory-status" data-zh-cn="项目发布后，这里会列出在线入口和源码。">Published projects will appear here with links to use them online and view their source code.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span lang="en">Open Projects</span>
      <a href="https://github.com/Ostrovsky2056/Ostrovsky2056.github.io" data-zh-cn="本站源码">Site source</a>
    </div>
  </footer>

</html>
