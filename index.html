<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ostrovsky2056’s personal lab for AI artwork, browser experiments, and notes on how they were made." data-zh-cn-content="Ostrovsky2056 的个人实验室，记录 AI 作品、浏览器实验和制作过程。">
  <meta name="theme-color" content="#f4f1e9">
  <title data-zh-cn="AI 创作实验室">AI Creation Lab</title>
  <link rel="icon" type="image/png" sizes="128x128" href="assets/favicon.png?v=3">
  <link rel="stylesheet" href="assets/site.css?v=8">
  <script src="assets/i18n.js?v=3" defer></script>
  <script src="assets/orbit-study.js?v=3" defer></script>
</head>
<body>
  <a class="skip-link button" href="#main" data-zh-cn="跳到主要内容">Skip to main content</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/" aria-current="page" aria-label="AI Creation Lab home" data-zh-cn-aria-label="AI 创作实验室首页">
        <img class="brand-mark" src="assets/favicon.png?v=3" width="128" height="128" alt="">
        <span class="brand-label" data-zh-cn="AI 创作实验室">AI Creation Lab</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation" data-zh-cn-aria-label="主导航">
        <a href="/experiments/" data-zh-cn="实验目录">Experiments</a>
        <a href="/notes/" data-zh-cn="制作记录">Notes</a>
        <a href="/about/" data-zh-cn="关于">About</a>
        <details class="language-menu" data-language-menu hidden>
          <summary class="language-trigger">
            <span class="visually-hidden" data-zh-cn="站点语言">Site language</span>
            <span data-language-indicator lang="en">EN</span>
          </summary>
          <div class="language-options">
            <button type="button" data-language-choice="auto" data-zh-cn="跟随浏览器" aria-pressed="true">Follow browser</button>
            <button type="button" data-language-choice="en" lang="en" aria-pressed="false">English</button>
            <button type="button" data-language-choice="zh-CN" lang="zh-CN" aria-pressed="false">简体中文</button>
          </div>
        </details>
      </nav>
    </div>
  </header>

  <main class="shell" id="main" tabindex="-1">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">
          <span data-zh-cn="AI 创作">AI Creation</span>
          <span class="hero-highlight" data-zh-cn="实验室">Lab</span>
        </h1>
        <p data-zh-cn="用 AI 做作品和工具，记录制作过程。">AI artwork, browser tools, and notes on how they’re made.</p>
      </div>

      <figure class="artwork">
        <div class="artwork-field">
          <img src="assets/orbit-study.webp?v=2" width="1440" height="960" fetchpriority="high"
            alt="Three orbits with parallel arcs and ticks surround a round black core with a vermilion center."
            data-zh-cn-alt="三条带有平行弧线和刻度的轨道环绕墨黑色圆形核心，中心有一个朱红色圆点。">
          <canvas class="artwork-motion" data-orbit-motion aria-hidden="true" hidden></canvas>
        </div>
      </figure>
    </section>

    <nav class="home-index" id="projects" aria-label="Explore the lab" data-zh-cn-aria-label="浏览实验室">
      <a class="home-index-link" href="/experiments/">
        <h2 data-zh-cn="实验目录">Experiments</h2>
        <p data-zh-cn="在线体验和源码。">Browser demos and source code.</p>
      </a>
      <a class="home-index-link" href="/notes/">
        <h2 data-zh-cn="制作记录">Making notes</h2>
        <p data-zh-cn="记录作品是怎么做出来的。">How the experiments were made.</p>
      </a>
    </nav>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <a href="https://github.com/Ostrovsky2056">Ostrovsky2056</a>
      <a href="https://github.com/Ostrovsky2056/Ostrovsky2056.github.io" data-zh-cn="本站源码">Site source</a>
    </div>
  </footer>
</body>
</html>
