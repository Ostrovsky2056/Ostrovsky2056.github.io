<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ostrovsky2056 的开源项目目录。发现可以直接在浏览器里使用的小工具，查看在线页面与源码。">
  <meta name="theme-color" content="#111710">
  <title>Open Projects · 开源项目</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body id="top">
  <a class="skip-link button" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#top" aria-label="Open Projects 首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-label" lang="en">Open Projects</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="#projects">项目目录</a>
        <a href="https://github.com/Ostrovsky2056">GitHub</a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="shell hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">开源工具，<br><span>打开就用。</span></h1>
        <p>这里收录我做的开源浏览器工具。<br class="hero-break">每个项目独立发布，在线页面和源码从目录进入。</p>
        <a class="button" href="#projects">浏览项目</a>
      </div>

      <div class="hero-art" aria-hidden="true">
        <div class="browser-shape browser-shape-back"></div>
        <div class="browser-shape browser-shape-middle"></div>
        <div class="browser-shape browser-shape-front">
          <div class="browser-bar">
            <span class="browser-dots"><i></i><i></i><i></i></span>
            <span class="browser-address"></span>
          </div>
          <div class="browser-body">
            <span class="browser-code">&lt;/&gt;</span>
            <span class="browser-lines"><i></i><i></i><i></i></span>
          </div>
        </div>
        <span class="art-corner art-corner-top"></span>
        <span class="art-corner art-corner-bottom"></span>
      </div>
    </section>

    <section class="shell directory" id="projects" aria-labelledby="projects-title">
      <h2 id="projects-title">项目目录</h2>

      <article class="project" id="screenshot-redactor" aria-labelledby="redactor-title">
        <div class="project-copy">
          <p class="project-status">筹备中</p>
          <h3 id="redactor-title">截图脱敏</h3>
          <p class="project-description">发工单、提 Issue 或分享聊天截图前，在浏览器里遮住手机号、邮箱和订单号，再复制或导出图片。</p>
          <p class="project-release">上线后可在这里打开工具和查看源码。</p>
        </div>

        <fieldset class="example">
          <legend class="visually-hidden">截图脱敏效果示例</legend>
          <input class="visually-hidden" type="radio" name="redaction-example" id="example-before">
          <input class="visually-hidden" type="radio" name="redaction-example" id="example-after" checked>
          <div class="example-controls">
            <span>效果示例</span>
            <div class="example-switch">
              <label for="example-before">脱敏前</label>
              <label for="example-after">脱敏后</label>
            </div>
          </div>
          <div class="example-window">
            <div class="example-window-header">
              <span class="example-file-icon" aria-hidden="true"></span>
              <strong>反馈工单</strong>
            </div>
            <dl class="example-fields">
              <div>
                <dt>邮箱</dt>
                <dd>
                  <span class="example-value">demo@example.com</span>
                  <span class="example-mask"><span class="visually-hidden">已遮挡</span></span>
                </dd>
              </div>
              <div>
                <dt>订单号</dt>
                <dd>
                  <span class="example-value">DEMO-0428</span>
                  <span class="example-mask example-mask-short"><span class="visually-hidden">已遮挡</span></span>
                </dd>
              </div>
              <div>
                <dt>说明</dt>
                <dd>附件预览无法打开</dd>
              </div>
            </dl>
          </div>
        </fieldset>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>Open Projects · Ostrovsky2056</span>
      <a href="https://github.com/Ostrovsky2056/Ostrovsky2056.github.io">本站源码</a>
    </div>
  </footer>
</body>
</html>
